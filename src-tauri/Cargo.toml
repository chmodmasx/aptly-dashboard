[package]
name = "supralinux-aptly-dashboard"
version = "0.1.0"
description = "SupraLINUX Aptly Repository Manager"
authors = ["SupraLINUX"]
edition = "2021"

[lib]
name = "supralinux_aptly_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
futures = "0.3"
