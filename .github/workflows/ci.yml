name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  backend:
    name: Rust backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Unit tests
        run: cargo test --manifest-path backend/Cargo.toml
      - name: Cargo check
        run: cargo check --manifest-path backend/Cargo.toml

  container:
    name: Dashboard container
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --tag aptly-dashboard:ci .
      - name: Smoke-test dashboard health
        run: |
          docker run -d --name aptly-dashboard-ci -p 127.0.0.1:18080:8080 aptly-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/dashboard/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/dashboard/health
      - name: Smoke-test multi-domain repo-server
        run: |
          mkdir -p /tmp/dashboard-state /tmp/aptly-root/public/supralinux/dists/stable
          cat > /tmp/dashboard-state/state.json <<'JSON'
          {
            "schemaVersion": 1,
            "publicEndpoints": [
              {
                "hostname": "repo.example.test",
                "prefix": "supralinux",
                "enabled": true
              }
            ]
          }
          JSON
          printf 'Release smoke test\n' > /tmp/aptly-root/public/supralinux/dists/stable/Release
          chmod -R a+rX /tmp/dashboard-state /tmp/aptly-root
          docker run -d --name aptly-repo-ci \
            -p 127.0.0.1:18081:8081 \
            -v /tmp/dashboard-state:/data:ro \
            -v /tmp/aptly-root:/aptly:ro \
            aptly-dashboard:ci repo-server
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/__health; then
              break
            fi
            sleep 1
          done
          curl -fsS -H 'Host: repo.example.test' \
            http://127.0.0.1:18081/dists/stable/Release \
            | grep -F 'Release smoke test'

      - name: Integration-test external Aptly 1.6.3 provider
        run: |
          docker network create aptly-integration
          docker volume create aptly-integration-data
          docker volume create dashboard-integration-data

          docker run -d \
            --name aptly-integration \
            --network aptly-integration \
            --network-alias aptly \
            -p 127.0.0.1:18082:8080 \
            -v aptly-integration-data:/opt/aptly \
            urpylka/aptly:1.6.3

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18082/api/version > /tmp/aptly-version.json; then
              break
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          with open("/tmp/aptly-version.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["Version"] == "1.6.3", payload
          PY

          docker run -d \
            --name aptly-dashboard-integration \
            --network aptly-integration \
            -p 127.0.0.1:18083:8080 \
            -e APTLY_URL=http://aptly:8080 \
            -v dashboard-integration-data:/data \
            aptly-dashboard:ci

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18083/api/dashboard/aptly/status > /tmp/dashboard-aptly.json; then
              break
            fi
            sleep 1
          done

          python3 - <<'PY'
          import json
          with open("/tmp/dashboard-aptly.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["version"] == "1.6.3", payload
          assert payload["compatibility"] == "supported", payload
          assert payload["healthy"] is True, payload
          assert payload["ready"] is True, payload
          PY
